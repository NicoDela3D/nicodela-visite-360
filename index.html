<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- mode app plein écran quand la page est ajoutée à l'écran d'accueil (iPad/iPhone/Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visite 3D">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Visite 3D — Étude de projet</title>
<link rel="stylesheet" href="https://esm.sh/@photo-sphere-viewer/core@5.15.1/index.css">
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.185.1",
    "three/examples/jsm/": "https://esm.sh/three@0.185.1/examples/jsm/",
    "@photo-sphere-viewer/core": "https://esm.sh/@photo-sphere-viewer/core@5.15.1?external=three"
  }
}
</script>
<style>
  :root {
    --bg: #14161a; --panel: #1e2127; --text: #e8e6e1; --muted: #9a978f; --accent: #d8a24a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { touch-action: manipulation; } /* pas de zoom double-tap sur les boutons (iPad) */
  /* rien n'est sélectionnable : le cliquer-glisser surlignait la page en bleu.
     Règle sur * (pas seulement body) : sur iPad, WebKit démarre parfois une
     sélection depuis un élément profond malgré la valeur héritée. */
  * { user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ---- barre du haut (toujours visible) ---- */
  .topbar { position: fixed; inset: 0 0 auto 0; z-index: 40;
            height: calc(56px + env(safe-area-inset-top, 0px));
            padding: env(safe-area-inset-top, 0px) 20px 0;
            display: flex; align-items: center; gap: 24px;
            background: linear-gradient(rgba(20,22,26,.92), rgba(20,22,26,.72));
            backdrop-filter: blur(8px); }
  .topbar h1 { font-size: 15px; font-weight: 500; letter-spacing: .04em; color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-left: auto; }
  .tabs button { border: 1px solid #4a4d55; background: var(--panel); color: var(--text);
                 font: inherit; font-size: 15px; font-weight: 500; padding: 9px 20px;
                 border-radius: 999px; cursor: pointer; transition: all .2s; }
  .tabs button:hover:not(:disabled):not(.active) { border-color: var(--accent); color: var(--accent); }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #14161a; }
  .tabs button:disabled { opacity: .3; cursor: default; }
  /* ---- sélecteur haie : deux segments, cadre coulissant sur l'état actif ---- */
  #haie-switch[hidden] { display: none; }
  #haie-switch { position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); right: 20px; z-index: 40;
                 display: flex; padding: 3px; border-radius: 999px;
                 background: var(--panel); border: 1px solid #3f5a3a; }
  #haie-switch button { position: relative; z-index: 1; flex: 1 1 0; border: 0;
                        background: transparent; color: var(--muted); font: inherit;
                        font-size: 13px; font-weight: 500; padding: 6px 16px;
                        border-radius: 999px; cursor: pointer; white-space: nowrap;
                        transition: color .25s; }
  #haie-switch button.active { color: #12200f; }
  #haie-switch button:not(.active):hover { color: var(--text); }
  #haie-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px;
                width: calc(50% - 3px); border-radius: 999px; background: #8fc57e;
                transition: transform .25s cubic-bezier(.4,0,.2,1); }
  #haie-switch.avec #haie-thumb { transform: translateX(100%); }

  /* ---- plan 3D : plein écran, ou minimap en écran pano ----
     Toutes les valeurs des deux états sont numériques : une longueur `auto`
     n'est pas interpolable et ferait sauter la fenêtre au lieu de l'animer. */
  #plan-wrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
               z-index: 30; overflow: hidden; border-radius: 0;
               border: 1px solid transparent;
               transition: all .45s cubic-bezier(.4,0,.2,1); }
  body[data-screen="pano"] #plan-wrap {
    top: calc(100vh - 216px - env(safe-area-inset-bottom, 0px));
    left: calc(16px + env(safe-area-inset-left, 0px)); width: 300px; height: 200px;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.55); border-color: #3a3d44;
  }
  #plan-wrap canvas { width: 100% !important; height: 100% !important; display: block; }
  body[data-screen="pano"] #plan-wrap canvas { cursor: pointer; } /* clic minimap = retour au plan */
  #markers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  /* ---- pastilles caméra ---- */
  .marker { position: absolute; transform: translate(-50%, -50%); pointer-events: auto;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .marker .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--panel);
                 border: 2px solid var(--accent); display: grid; place-items: center;
                 font-size: 15px; transition: transform .15s; }
  .marker:hover .dot { transform: scale(1.15); }
  .marker.active .dot { background: var(--accent); }
  .marker .label { font-size: 12px; background: rgba(20,22,26,.85); padding: 3px 9px;
                   border-radius: 999px; white-space: nowrap; }
  body[data-screen="pano"] .marker .label { display: none; }
  body[data-screen="pano"] .marker .dot { width: 22px; height: 22px; font-size: 10px; }

  /* ---- panorama ---- */
  #pano-wrap { position: fixed; inset: 0; z-index: 20; opacity: 0; pointer-events: none;
               transition: opacity .4s; background: #000; }
  body[data-screen="pano"] #pano-wrap { opacity: 1; pointer-events: auto; }
  #pano { position: absolute; inset: 0; }
  #btn-back { position: absolute; top: calc(72px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 25;
              border: 1px solid #3a3d44; background: rgba(20,22,26,.85); color: var(--text);
              font: inherit; font-size: 14px; padding: 9px 18px; border-radius: 999px;
              cursor: pointer; }
  #btn-back:hover { border-color: var(--accent); color: var(--accent); }
  #btn-alt { position: absolute; top: calc(72px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 25;
             border: 1px solid #3a3d44; background: rgba(20,22,26,.85); color: var(--text);
             font: inherit; font-size: 14px; padding: 9px 18px; border-radius: 999px;
             cursor: pointer; }
  #btn-alt:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- chargement / erreurs ---- */
  #load-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
                  background: var(--bg); transition: opacity .4s; }
  #load-overlay.hidden { opacity: 0; pointer-events: none; }
  .progress { width: 220px; height: 3px; background: #2a2d33; border-radius: 2px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60;
            background: #5c2626; color: #fff; padding: 10px 18px; border-radius: 8px;
            font-size: 13px; display: none; max-width: 80vw; }
</style>
</head>
<body data-screen="plan">
  <header class="topbar">
    <h1>Visite 3D — Étude de projet</h1>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <!-- sélecteur haie : sous les onglets, pour ne pas les faire bouger -->
  <div id="haie-switch" hidden>
    <div id="haie-thumb"></div>
    <button type="button" data-haie="sans">Sans haie</button>
    <button type="button" data-haie="avec">Avec haie</button>
  </div>

  <div id="plan-wrap">
    <div id="markers"></div>
  </div>

  <div id="pano-wrap">
    <div id="pano"></div>
    <button id="btn-back" type="button">← Retour au plan</button>
    <button id="btn-alt" type="button" hidden>Vue drone</button>
  </div>

  <div id="load-overlay"><div class="progress"><div id="load-bar"></div></div></div>
  <div id="banner"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
